steps:
- name: gcr.io/cloud-builders/docker
  args: ['build', '--build-arg', 'VITE_API_URL=${_API_URL}', '-t', '${_IMAGE}', '.']
images: ['${_IMAGE}']
substitutions:
  _IMAGE: europe-west1-docker.pkg.dev/lunar-site-select/lunarsite/ui:latest
  _API_URL: https://api.lunarsite.select
options:
  machineType: E2_HIGHCPU_8
