[project]
name = "lunarnav"
version = "0.1.0"
description = "Sun and Earth visibility geometry for lunar surface sites"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "spiceypy>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "certifi>=2026.10.23",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
