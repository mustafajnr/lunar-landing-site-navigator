<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Lunar Landing Site Navigator logo, small version</title>
  <!-- Hand-written SVG, AI-generated (Claude Code). Simplified for 16 to 32 px: bigger discs,
       wider dark rings and fewer details. Each body is drawn with radius 100 around 0,0. -->
  <defs>
    <radialGradient id="sunFill" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.55" stop-color="#ffd54a"/>
      <stop offset="1" stop-color="#f5a623"/>
    </radialGradient>
    <g id="sun">
      <circle r="100" fill="url(#sunFill)"/>
      <circle cx="34" cy="-30" r="11" fill="#8a4b08"/>
      <circle r="95" fill="none" stroke="#d98a00" stroke-width="10"/>
    </g>

    <clipPath id="earthClip"><circle r="100"/></clipPath>
    <g id="earth">
      <circle r="100" fill="#2f86e0"/>
      <g clip-path="url(#earthClip)">
        <!-- Europe and Africa in one shape -->
        <path fill="#5fb85a" d="M-14,-66 C6,-74 34,-66 34,-48 C30,-36 40,-26 50,-12 C56,2 42,16 38,32 C34,50 22,66 8,72 C-4,72 -6,56 -8,44 C-12,32 -30,20 -40,4 C-46,-10 -36,-26 -20,-32 C-26,-44 -26,-58 -14,-66 Z"/>
        <ellipse cx="0" cy="-104" rx="74" ry="26" fill="#ffffff"/>
      </g>
      <circle r="95" fill="none" stroke="#1a5fb0" stroke-width="10"/>
    </g>

    <clipPath id="moonClip"><circle r="100"/></clipPath>
    <g id="moon">
      <circle r="100" fill="#c9ccd2"/>
      <g clip-path="url(#moonClip)" fill="#737985">
        <!-- Procellarum and Imbrium -->
        <path d="M-70,-36 C-54,-62 -10,-66 -4,-40 C0,-22 -24,-16 -32,4 C-38,24 -34,44 -54,46 C-74,46 -86,20 -84,-6 C-82,-20 -78,-28 -70,-36 Z"/>
        <!-- Serenitatis and Tranquillitatis -->
        <path d="M8,-46 C26,-50 34,-34 30,-24 C46,-22 52,-4 44,8 C34,18 12,16 4,2 C-2,-10 -4,-36 8,-46 Z"/>
        <!-- Crisium -->
        <circle cx="66" cy="-24" r="13"/>
      </g>
      <!-- Tycho -->
      <circle cx="-8" cy="62" r="11" fill="#f2f3f5"/>
      <circle r="95" fill="none" stroke="#868c96" stroke-width="10"/>
    </g>

    <!-- The dark ring around a front body shows only where it covers a body behind it. -->
    <clipPath id="behindEarth"><circle cx="322" cy="190" r="170"/></clipPath>
    <clipPath id="behindMoon"><circle cx="322" cy="190" r="170"/><circle cx="134" cy="226" r="112"/></clipPath>
  </defs>

  <use href="#sun" transform="translate(322 190) scale(1.7)"/>
  <circle cx="134" cy="226" r="136" fill="#0b0f17" clip-path="url(#behindEarth)"/>
  <use href="#earth" transform="translate(134 226) scale(1.12)"/>
  <circle cx="262" cy="364" r="158" fill="#0b0f17" clip-path="url(#behindMoon)"/>
  <use href="#moon" transform="translate(262 364) scale(1.34)"/>
</svg>
